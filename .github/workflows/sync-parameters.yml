name: Sync runtime parameters

on:
  workflow_dispatch:
    inputs:
      parameter:
        description: Publicar un JSON completo o los tres (fuente GitHub Actions Secrets)
        type: choice
        options: [all, mongo-health, mongo, mongo-domains, providers]
        required: true

permissions: {}

concurrency:
  group: foodly-notes-test-delivery
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'matigaleanodev/foodly-notes-api-cloud' && github.ref == 'refs/heads/dev'
    environment: production-parameters
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      PARAMETERS_ENVIRONMENT: production-parameters
      PARAMETER: ${{ inputs.parameter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::650387442642:role/foodly-notes-test-parameters-sync
          aws-region: us-east-1
          allowed-account-ids: '650387442642'
          role-session-name: foodly-parameters-${{ github.run_id }}
      - name: Validate all selected payloads and publish
        env:
          FOODLY_HEALTH_MONGO_JSON: ${{ (inputs.parameter == 'all' || inputs.parameter == 'mongo-domains' || inputs.parameter == 'mongo-health') && secrets.FOODLY_HEALTH_MONGO_JSON || '' }}
          FOODLY_MONGO_JSON: ${{ (inputs.parameter == 'all' || inputs.parameter == 'mongo-domains' || inputs.parameter == 'mongo') && secrets.FOODLY_MONGO_JSON || '' }}
          FOODLY_PROVIDERS_JSON: ${{ (inputs.parameter == 'all' || inputs.parameter == 'providers') && secrets.FOODLY_PROVIDERS_JSON || '' }}
        run: python3 -I scripts/sync_parameters.py
