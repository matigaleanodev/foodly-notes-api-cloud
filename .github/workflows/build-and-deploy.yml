name: build and deploy

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: SHA completo de dev revisado para empaquetar
        required: true
        type: string
      deploy:
        description: Ejecutar el despliegue test previamente autorizado
        type: boolean
        default: false

permissions: {}

concurrency:
  group: foodly-notes-test-delivery
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: 'true'
  TEST_HEALTH_MONGO_SECRET_ARN: ${{ vars.TEST_HEALTH_MONGO_SECRET_ARN }}
  TEST_MONGO_SECRET_ARN: ${{ vars.TEST_MONGO_SECRET_ARN }}
  TEST_PROVIDER_SECRET_ARN: ${{ vars.TEST_PROVIDER_SECRET_ARN }}
  TEST_RECIPES_ROLE_ARN: ${{ vars.TEST_RECIPES_ROLE_ARN }}
  TEST_HEALTH_ROLE_ARN: ${{ vars.TEST_HEALTH_ROLE_ARN }}
  TEST_CLOUDFORMATION_ROLE_ARN: ${{ vars.TEST_CLOUDFORMATION_ROLE_ARN }}
  TEST_DEPLOYMENT_BUCKET: ${{ vars.TEST_DEPLOYMENT_BUCKET }}
  TEST_SUBNET_IDS: ${{ vars.TEST_SUBNET_IDS }}
  TEST_SECURITY_GROUP_IDS: ${{ vars.TEST_SECURITY_GROUP_IDS }}
  TEST_CORS_ORIGIN: ${{ vars.TEST_CORS_ORIGIN }}

jobs:
  package:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthesize and review CDK assembly
        env:
          AWS_ACCESS_KEY_ID: local-synth
          AWS_SECRET_ACCESS_KEY: local-synth
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_CONFIG_FILE: /dev/null
        run: |
          npm run build
          npm run synth
          node scripts/review-package.mjs cdk.out
          find cdk.out -type f -print0 | sort -z | xargs -0 sha256sum > delivery.sha256
      - name: Save reviewed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-delivery-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          path: |
            cdk.out/
            delivery.sha256

  deploy:
    needs: package
    if: inputs.deploy && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require authorization for this revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          APPROVED_SHA: ${{ vars.TEST_DEPLOYMENT_APPROVED_SHA }}
          NETWORK_REVIEWED: ${{ vars.TEST_NETWORK_REVIEWED }}
          RECOVERY_REVIEWED: ${{ vars.TEST_RECOVERY_REVIEWED }}
        run: |
          test "$APPROVED_SHA" = "$REVIEWED_SHA"
          test "$NETWORK_REVIEWED" = true
          test "$RECOVERY_REVIEWED" = true
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore reviewed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-delivery-${{ github.sha }}
          path: .
      - name: Verify reviewed artifacts
        run: |
          sha256sum --check delivery.sha256
          node scripts/review-package.mjs cdk.out
      - name: Assume test pipeline role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TEST_PIPELINE_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '650387442642'
          role-session-name: foodly-test-${{ github.run_id }}
      - name: Verify identity and deploy reviewed package
        env:
          PIPELINE_ROLE_ARN: ${{ vars.TEST_PIPELINE_ROLE_ARN }}
        run: |
          [[ "$PIPELINE_ROLE_ARN" =~ ^arn:aws:iam::650387442642:role/foodly-notes-test-[a-zA-Z0-9_-]+$ ]]
          identity="$(aws sts get-caller-identity --region us-east-1 --output json)"
          test "$(jq -r .Account <<< "$identity")" = 650387442642
          test "$(jq -r .Arn <<< "$identity" | cut -d/ -f2)" = "${PIPELINE_ROLE_ARN##*/}"
          [[ "$TEST_CLOUDFORMATION_ROLE_ARN" =~ ^arn:aws:iam::650387442642:role/foodly-notes-test-[a-zA-Z0-9_-]+$ ]]
          npm exec --workspace=@foodly-notes/infrastructure -- cdk deploy --app ../../cdk.out FoodlyNotesTest --role-arn "$TEST_CLOUDFORMATION_ROLE_ARN" --method direct --require-approval never --no-notices
